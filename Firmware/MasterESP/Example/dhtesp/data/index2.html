<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style2.css">
  <script src="https://code.highcharts.com/highcharts.js"></script> <!-- The chart plot library -->
  <title>Gravity Gardens SHM</title>
</head>
<body>
	<div id="header">
		<div class="container">
			<h1>Gravity Gardens SMH</h1>
			<h3><a href="./index.html">Sensors</a> | <a href="./index2.html">Controls</a></h3>
		</div>
	</div>
  <div class="main-container">
	<div>
		<h3>Lights</h3>
		<label class="switch">
		<input type="checkbox" onchange="toggleCheckbox(this)" id="2" " + outputState(2) + ">
		<span class="slider"></span>
		</label>
	</div>
	<div class="container"> <!-- https://randomnerdtutorials.com/esp32-esp8266-input-data-html-form refer to this  -->
		<form action="/get" method="GET">
            <label for="input1">Time (days):</label>
            <input type="text" id="input1" name="input1">

            <label for="input2">Motor Speed (g):</label>
            <input type="text" id="input2" name="input2">

            <label for="input3">Something:</label>
            <input type="text" id="input3" name="input3">

            <input type="submit" value="Submit">
			<!-- after clicking the button, it should confirm whether the data submitted is received or not
			like adding a green text "Settings Submitted!" and red text "Settings failed to upload!" maybe-->
        </form>
	</div>
	
  </div>
  
  <div class="progress-container">
        <h3>Cycle Progress</h3>
        <progress id="progressBar" value="50" max="100"></progress><br>
        <button id="normal-button" onclick="increaseProgress()">Continue</button>
		<button id="normal-button" onclick="decreaseProgress()">Pause</button>
		<button id="special-button" onclick="stopProgress()">Stop</button>
		<!-- after clicking the button, it should say the state that it is in (paused, stopped, running)-->
    </div>
  <script src="script2.js"></script>
</body>
</html>
