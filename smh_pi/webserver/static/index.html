<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="highcharts.js"></script> <!-- The chart plot library -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="comms.js"></script>
    <title>Gravity Gardens SHM</title>
</head>
<body>

<div id="header">
    <div class="logo-container">
        <img src="gravitygardens_logo.jpg" alt="Logo" class="logo">
        <h1>SHM Dashboard</h1>
    </div>
</div>
<div class="container-input">
    <!-- https://randomnerdtutorials.com/esp32-esp8266-input-data-html-form refer to this  -->
    <form id="settingsForm">
        <div class="form-row">
            <label for="input1">Experiment Name:</label>
            <input type="text" id="input1" name="input1">
        </div>
        <div class="form-row">
            <label for="input2">Motor Speed (g):</label>
            <input type="text" id="input2" name="input2">
            <p id="rpm-calc">RPM = 0</p>
        </div>
        <div class="form-row">
            <label for="input3">Time (Minutes):</label> <!-- How specific do we want the time-set (Hours, minutes?) -->
            <input type="text" id="input3" name="input3" min="1" required>
        </div>
        <div class="form-row">
            <label for="input4">Light Timer ON (Minutes):</label>
            <input type="text" id="input4" name="input4">
        </div>
        <div class="form-row">
            <label for="input5">Light Timer OFF (Minutes):</label>
            <input type="text" id="input5" name="input5">
        </div>
        <div class="form-row">
            <label for="input6">Description:</label>
            <input type="textarea" id="input6" name="input6">
        </div>
        <input type="submit" value="Start">
        <!-- after clicking the button, it should confirm whether the data submitted is received or not
        like adding a green text "Settings Submitted!" and red text "Settings failed to upload!" maybe-->
    </form>

    <div class="progress-container">
        <h3>Cycle Progress</h3>
        <div id="progress-info">
            <p>Experiment Name: <span id="experiment-name">--</span></p>
            <p>Status: <span id="status-text">Stopped</span></p>
            <p>Time Remaining: <span id="time-remaining">00:00</span></p>
            <p>Lights ON: <span id="time-remaining-on">00:00</span></p>
            <p>Lights OFF: <span id="time-remaining-off">00:00</span></p>
        </div>
        <progress id="progressBar" value="50" max="100"></progress>
        <br>
        <button class="normal-button" onclick="ContinueProgress()">Continue</button>
        <button class="normal-button" onclick="PauseProgress()">Pause</button>
        <button id="special-button" onclick="stopProgress()">Stop</button>
        <!-- after clicking the button, it should say the state that it is in (paused, stopped, running)-->
    </div>
    <div id="logs">
        <button id="view-log">View Logs</button>
    </div>
</div>
<div id="statusMessage"></div>

<div class="container">
    <div id="chart-combined"></div>
    <div id="chart-accel"></div>
    <div id="chart-rpm"></div>
</div>

<script src="script.js"></script>
</body>
</html>
